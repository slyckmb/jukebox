version: "3.9"

services:
  jukebox:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: jukebox
    restart: unless-stopped
    environment:
      # Lidarr Configuration
      LIDARR_URL: ${LIDARR_URL:-http://lidarr:8686/api/v1}
      LIDARR_API_KEY: ${LIDARR_API_KEY}
      LIDARR_QUALITY_PROFILE_ID: ${LIDARR_QUALITY_PROFILE_ID:-1}
      LIDARR_METADATA_PROFILE_ID: ${LIDARR_METADATA_PROFILE_ID:-1}

      # Flask Configuration
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-CHANGE_ME_IN_PROD_JUKEBOX}

      # Storage Configuration
      MUSIC_ROOT_BASE: ${MUSIC_ROOT_BASE:-/data/media/music}
      DB_PATH: ${DB_PATH:-/app/data/requests.db}

      # Media Server URLs (Optional)
      PLEX_URL: ${PLEX_URL:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      NAVIDROME_URL: ${NAVIDROME_URL:-}
    volumes:
      - ./data:/app/data
    ports:
      - "5000:5000"

