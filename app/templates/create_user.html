{% extends "base.html" %}

{% block title %}Create User - Jukebox{% endblock %}

{% block content %}
<div class="create-user-page">
  <!-- Header -->
  <header class="page-header">
    <a href="{{ url_for('list_requests') }}" class="back-button" aria-label="Back">
      <span>←</span>
    </a>
    <h1>Create User</h1>
    <div></div>
  </header>

  <!-- Form -->
  <div class="container">
    <form method="POST" class="user-form">
      <div class="form-group">
        <label for="username">
          Username
          <span class="required">*</span>
        </label>
        <input
          type="text"
          id="username"
          name="username"
          required
          autofocus
          autocomplete="off"
          placeholder="Enter username"
        >
      </div>

      <div class="form-group">
        <label for="password">
          Password
          <span class="required">*</span>
        </label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="new-password"
          placeholder="Enter password"
        >
        <p class="form-hint">Choose a secure password</p>
      </div>

      <div class="form-group">
        <label class="checkbox-label">
          <input
            type="checkbox"
            name="is_admin"
            class="checkbox-input"
          >
          <span class="checkbox-text">Admin privileges</span>
        </label>
        <p class="form-hint">Admins can view all requests and create users</p>
      </div>

      <div class="form-actions">
        <a href="{{ url_for('list_requests') }}" class="btn btn-secondary">
          Cancel
        </a>
        <button type="submit" class="btn btn-primary">
          Create User
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.create-user-page {
  min-height: 100vh;
  background: var(--bg-secondary);
}

.user-form {
  background: var(--bg-primary);
  border-radius: var(--radius-lg);
  padding: var(--spacing-lg);
  margin-top: var(--spacing-md);
  box-shadow: var(--shadow-sm);
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  cursor: pointer;
  margin: 0;
}

.checkbox-input {
  width: 24px;
  height: 24px;
  cursor: pointer;
}

.checkbox-text {
  font-weight: 500;
  color: var(--text-primary);
}
</style>
{% endblock %}
